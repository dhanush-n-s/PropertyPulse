{% extends 'Guest/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <br>
    <br>
    <title>User Registration</title>

    <!-- CSS ADDED -->
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        .register-box {
            margin-top: 80px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }

        table {
            background: #ffffff;
            border-collapse: collapse;
            width: 650px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            border-radius: 6px;
            overflow: hidden;
        }

        table td {
            padding: 12px 15px;
            font-size: 14px;
            color: #333;
        }

        table td:first-child {
            width: 35%;
            font-weight: 500;
            background: #f8f9fa;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #007bff;
        }

        .gender-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .gender-group label {
            margin-right: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        input[type="submit"] {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin: 5px;
        }

        input[type="submit"][value="Cancel"] {
            background: #6c757d;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        input[type="submit"][value="Cancel"]:hover {
            background: #545b62;
        }

        @media (max-width: 768px) {
            table {
                width: 95%;
            }

            table td {
                display: block;
                width: 100%;
            }

            table td:first-child {
                background: transparent;
                padding-bottom: 5px;
            }
        }
    </style>
</head>

<body>

<div class="register-box">
    <center>
    <h2>User Registration</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table border="2">
            <tr>
                <td>Name</td>
                <td><input required type="text" name="txt_name" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td class="gender-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>Contact</td>
                <td>
                    <input required type="number" name="txt_contact"
                           pattern="[7-9]{1}[0-9]{9}"
                           title="Phone number with 7-9 and remaing 9 digit with 0-9">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input required type="email" name="txt_mail"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input required type="password" name="txt_pass"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                           title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                </td>
            </tr>

            <tr>
                <td>Confirm Password</td>
                <td><input type="text" name="txt_retype"></td>
            </tr>

            <tr>
                <td>District</td>
                <td>
                    <select name="sel_district" id="sel_district">
                        <option value="">Select District</option>
                        {% for i in districtdata %}
                        <option {% if i.id == editdata.district.id %}selected{% endif %} value="{{ i.id }}">
                            {{ i.district_name }}
                        </option>
                        {% endfor %}
                    </select>
                </td>
            </tr>

            <tr>
                <td>Place</td>
                <td>
                    <select name="sel_place" id="sel_place">
                        <option value="">Select Place</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td><textarea name="txt_add" required></textarea></td>
            </tr>

            <tr>
                <td>Photo</td>
                <td><input required type="file" name="txt_photo"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="submit" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
    </center>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $('#sel_district').change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:AjaxPlace' %}";
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $('#sel_place').html(data);
            }
        });
    });
</script>

</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location.href = "{% url 'Guest:NewUser' %}";
</script>
{% endif %}
{% endblock content %}
