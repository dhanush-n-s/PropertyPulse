<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="1">
            <tr>
                <td>Old Password</td>
                <td><input required type="password" name="txt_old" id="" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td>New Password</td>
                <td><input required type="password" name="txt_new" id="" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td>Re-type Password</td>
                <td><input required type="password" name="txt_re" id="" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
               <input type="submit" value="Change Password">
               <input type="submit" value="Cancel">
            </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
{% if msg %}
        <script>
         alert("{{msg}}")
         window.location="{% url 'Seller:Profile' %}"
        </script>
        {% endif  %}
