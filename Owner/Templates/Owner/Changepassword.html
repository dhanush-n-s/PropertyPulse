{% extends 'Owner/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <!-- CSS ADDED -->
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .password-wrapper {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-box {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table td {
            padding: 12px;
            border: 1px solid #dee2e6;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="submit"] {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        input[value="Change Password"] {
            background-color: #007bff;
            color: #ffffff;
            margin-right: 10px;
        }

        input[value="Change Password"]:hover {
            background-color: #0056b3;
        }

        input[value="Cancel"] {
            background-color: #6c757d;
            color: #ffffff;
        }

        input[value="Cancel"]:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
    <br>
    <br>
    <div class="password-wrapper">
        <div class="password-box">
            <h1>Change Password</h1>

            <form action="" method="post">
                {% csrf_token %}
                <table border="1">
                    <tr>
                        <td>Old Password</td>
                        <td>
                            <input required type="password" name="txt_old"
                                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                   title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                        </td>
                    </tr>
                    <tr>
                        <td>New Password</td>
                        <td>
                            <input required type="password" name="txt_new"
                                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                   title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                        </td>
                    </tr>
                    <tr>
                        <td>Re-type Password</td>
                        <td>
                            <input required type="password" name="txt_re"
                                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                   title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Change Password">
                            <input type="submit" value="Cancel">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Owner:Profile' %}"
</script>
{% endif %}

{% endblock content %}
