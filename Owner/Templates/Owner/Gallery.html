{% extends 'Owner/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            padding-top: 120px;   /* space for header */
            padding-bottom: 80px; /* space for footer */
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            background-color: #ffffff;
            margin: 20px auto;
            min-width: 600px;
        }

        table td {
            padding: 10px 15px;
            text-align: center;
            vertical-align: middle;
        }

        table tr:first-child {
            background-color: #e9ecef;
            font-weight: bold;
        }

        input[type="file"] {
            padding: 6px;
        }

        input[type="submit"] {
            padding: 8px 16px;
            background-color: #198754;
            border: none;
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #146c43;
        }

        img {
            border-radius: 6px;
            object-fit: cover;
        }

        
    </style>
</head>

<body>
    <form method="post" enctype="multipart/form-data">
        <center>
            <h1>Gallery</h1>
            {% csrf_token %}
            <table border="2">

                <tr>
                    <td>Add Photo</td>
                    <td><input required type="file" name="txt_photo" value=""></td>
                </tr>
                <tr>
                    <td colspan="2" align="center"><input type="submit" value="Upload"></td>
                </tr>
            </table>
            <br>
            <table border="2">
                <tr>
                    <td>Sno</td>
                    <td>Photo</td>
                    <td colspan="1">Action</td>
                </tr>
                {% for i in gallerydata %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td><img src="{{i.gallery_photo.url}}" width="100" height="100"></td>
                    <td><a href="{% url 'Owner:delgallery' i.id oid  %}">Delete</a></td>
                </tr>
                {% endfor %}
        </center>
    </form>
</body>

</html>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Owner:gallery' oid %}"
</script>
{% endif %}
{% endblock content %}
