{% extends 'User/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Request</title>

    <!-- CSS ADDED -->
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .service-wrapper {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .service-box {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table td {
            padding: 12px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            vertical-align: middle;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <br>
    <br>
    <div class="service-wrapper">
        <div class="service-box">
            <h1>Service Request</h1>

            <form method="post">
                {% csrf_token %}
                <table border="2">
                    <tr>
                        <td>Title:</td>
                        <td>
                            <input required type="text" name="txt_title" value="">
                        </td>
                    </tr>
                    <tr>
                        <td>Details:</td>
                        <td>
                            <textarea name="txt_details" required rows="4" cols="30"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Submit">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'User:mybookings' %}"
</script>
{% endif %}

{% endblock content %}
