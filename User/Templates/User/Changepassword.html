{% extends 'User/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <!-- CSS ADDED -->
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }

        table {
            background: #ffffff;
            border-collapse: collapse;
            width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            border-radius: 6px;
            overflow: hidden;
        }

        table td {
            padding: 12px 15px;
            font-size: 14px;
            color: #333;
        }

        table td:first-child {
            width: 40%;
            font-weight: 500;
            background: #f8f9fa;
        }

        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #007bff;
        }

        input[type="submit"] {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin: 5px;
        }

        input[type="submit"][value="Cancel"] {
            background: #6c757d;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        input[type="submit"][value="Cancel"]:hover {
            background: #545b62;
        }

        @media (max-width: 768px) {
            table {
                width: 95%;
            }

            table td {
                display: block;
                width: 100%;
            }

            table td:first-child {
                background: transparent;
                padding-bottom: 5px;
            }
        }
    </style>
</head>

<body>
    <form action="" method="post">
        <center>
            <br><br><br><br><br><br>
            <h1>Change Password</h1>
            {% csrf_token %}
            <table border="1">
                <tr>
                    <td>Old Password</td>
                    <td>
                        <input required type="password" name="txt_old"
                               value="{{Data.user_password}}"
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                               title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                    </td>
                </tr>

                <tr>
                    <td>New Password</td>
                    <td>
                        <input required type="password" name="txt_new"
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                               title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                    </td>
                </tr>

                <tr>
                    <td>Re-type Password</td>
                    <td>
                        <input required type="password" name="txt_re"
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                               title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Change Password">
                        <input type="submit" value="Cancel">
                    </td>
                </tr>
            </table>
        </center>
    </form>
    <br>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'User:Profile' %}";
</script>
{% endif %}
{% endblock content %}
