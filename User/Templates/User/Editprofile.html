{% extends 'User/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <!-- CSS ADDED -->
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        form {
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }

        table {
            background: #ffffff;
            border-collapse: collapse;
            width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            border-radius: 6px;
            overflow: hidden;
        }

        table td {
            padding: 12px 15px;
            font-size: 14px;
            color: #333;
        }

        table td:first-child {
            width: 35%;
            font-weight: 500;
            background: #f8f9fa;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #007bff;
        }

        input[type="submit"] {
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        @media (max-width: 768px) {
            form {
                margin-top: 40px;
            }

            table {
                width: 95%;
            }

            table td {
                display: block;
                width: 100%;
            }

            table td:first-child {
                background: transparent;
                padding-bottom: 5px;
            }
        }
    </style>
</head>

<body>
    <br>
    <br>
    <form action="" method="post">
        
        {% csrf_token %}
        <table border="1">
            
           
            <tr>
                <td>Name</td>
                <td>
                    <input required type="text" name="txt_name"
                           value="{{Data.user_name}}"
                           title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter"
                           pattern="^[A-Z]+[a-zA-Z ]*$">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input required type="email" name="txt_email" value="{{Data.user_email}}"></td>
            </tr>

            <tr>
                <td>Contact</td>
                <td>
                    <input required type="number" name="txt_contact"
                           value="{{Data.user_contact}}"
                           pattern="[7-9]{1}[0-9]{9}"
                           title="Phone number with 7-9 and remaing 9 digit with 0-9">
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea name="txt_address" required rows="4" cols="30">{{Data.user_address}}</textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Update">
                </td>
            </tr>
        </table>
    </form>
    <br>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
</script>
{% endif %}
{% endblock content %}
