{% extends 'Admin/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            background-color: #ffffff;
            width: 400px;
        }

        table td {
            border: 1px solid #333;
            padding: 10px;
        }

        table tr:first-child td {
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: cadetblue;
        }

        input[type="submit"] {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: aqua;
        }

        center {
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <center>
        <h1><b>Payment Page</b></h1>
        
        <form method="POST">
            {% csrf_token %}
            <table border="2">
                <tr>
                    <td>Amount</td>
                    <td><input required type="text" name="txt_amount"></td>
                </tr>
                <tr>
                    <td>Reply</td>
                    <td><textarea name="txt_reply" rows="4" cols="30" required></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Submit">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>

</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Admin:viewservices' %}"
</script>
{% endif %}
{% endblock content %}
