<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminRegistration</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <table><tr>
            <td>Name</td>
            <td><input required type="text" name="txt_name" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$" value="{{editdata.admin_name}}"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input required type="text" name="txt_email" value="{{editdata.admin_email}}"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input required type="text" name="txt_pass" value="{{editdata.admin_password}}" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="submit">
            </td>
        </tr></table>
        <table border="2"><tr>
            <td>Sno</td>
            <td>Name</td>
             <td>Email</td>
              <td>Password</td>
            <td colspan="2" align="center">Action</td>
        </tr>
        {% for i in admindata %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.admin_name}}</td>
            <td>{{i.admin_email}}</td>
            <td>{{i.admin_password}}</td>
            <td><a href="{% url 'Admin:deladmin' i.id %}">delete</a></td>
            <td><a href="{% url 'Admin:editadmin' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
</body>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:AdminReg' %}"
</script>
{% endif %}
</html>
