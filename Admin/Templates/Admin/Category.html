<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category</title>
</head>
<body>
  <form method="post">
        {% csrf_token %}
        <table border="2"><tr>
            <td>Category</td>
            <td ><input required ="text" name="txt_cat" value="{{editdata.category_name}}" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="submit">
            </td>
           
        </tr></table>
        <table border="2"><tr>
            <td>Sno</td>
            <td>Category Name</td>
            <td colspan="2" align="center">Action</td>
        </tr>
        {% for i in categorydata %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.category_name}}</td>
            <td><a href="{% url 'Admin:delcategory' i.id %}">delete</a></td>
             <td><a href="{% url 'Admin:editcategory' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}

    </form>  
</body>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:Category' %}"
</script>
{% endif %}
</html>
