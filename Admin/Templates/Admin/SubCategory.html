<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubCategory</title>
</head>
<body>
    <form method="post">
          {% csrf_token %}
        <table border="2"><tr>
            <td>Category</td>
            <td>
                <select name="sel_category">
                    <option value="">select category</option>
                    {% for i in categorydata %}
                    <option {% if i.id == editdata.category.id %}
                    selected
                    {% endif %}
                     value="{{i.id}}">{{i.category_name}}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <td>Sub Category</td>
            <td><input required type="text" name="txt_subcat" value="{{editdata.subcategory_name}}" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"></td>
        </tr>
        <tr>
            <td colspan="2" align="center"><input type="submit" value="submit"></td>
            
        </tr></table>
        </table>
         <table border="2">
            <tr>
                <td>Sno</td>
                <td>Category Name</td>
                <td>Sub Category </td>
                <td colspan="2" align="center">Action</td>
            </tr>
            <tr>
    <tr>
        {% for i in subcategorydata %}
            <td>{{forloop.counter}}</td>
            <td>{{i.category.category_name}}</td>
            <td>{{i.subcategory_name}}</td>
            <td><a href="{% url 'Admin:editsubcategory' i.id %}">edit</a></td>
            <td><a href="{% url 'Admin:delsubcategory' i.id %}">Delete</a></td>
    </tr>
        {% endfor %} 
        </table>
    
    </form>
</body>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:subcategory' %}"
</script>
{% endif %}
</html>
