{% extends "Admin/Head.html" %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- CSS ADDED ONLY -->
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;

            /* Prevent overlap with Admin header/footer */
            padding-top: 120px;
            padding-bottom: 80px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            background-color: #ffffff;
            margin: 20px auto;
            min-width: 600px;
        }

        table td {
            padding: 10px 14px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            text-align: center;
        }

        table tr:first-child {
            background-color: #e9ecef;
            font-weight: bold;
        }

        input[type="text"] {
            width: 90%;
            padding: 6px;
        }

        input[type="submit"] {
            padding: 8px 18px;
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #084298;
        }

        a[href*="del"] {
            background-color: #e20404;
        }
        a[href*="edit"]{
            background-color: #0bddf4;
        }

        a:hover {
            background-color: #b02a37;
        }
    </style>
</head>

<body>
  <form method="post">
    <center>
    <h1>Property Type</h1>
        {% csrf_token %}
         <table border="2"><tr>
        <td>Property:</td>
            <td ><input required type="text" name="txt_propertytype" value="" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="submit">
            </td>
        </tr>
    </table>
    <br>
    <table border="2"><tr>
            <td>Sno</td>
            <td>Property type</td>
            <td colspan="2" align="center">Action</td>
        </tr>
        {% for i in propertydata %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.propertytype_name}}</td>
            <td><a href="{% url 'Admin:delpropertytype' i.id %}">Delete</a></td>
            <td><a href="{% url 'Admin:edipropertype' i.id %}">Edit</a></td>
            </tr>
        {% endfor %}
    </table>
</form>
</center> 
</body>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:propertytype' %}"
</script>
{% endif %}
</html>
{% endblock content %}
