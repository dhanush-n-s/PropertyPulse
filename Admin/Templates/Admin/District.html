{% extends 'Admin/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District</title>

    <style>
        

        table {
            border-collapse: collapse;
            background-color: #ffffff;
            margin: 20px auto;
            min-width: 500px;
        }

        td {
            padding: 10px 15px;
            text-align: center;
            vertical-align: middle;
        }

        table tr:first-child {
            background-color: #1367ba;
            font-weight: bold;
        }

        input[type="text"] {
            padding: 6px 10px;
            width: 220px;
            background-color: rgb(225, 213, 213);
        }

        input[type="submit"] {
            padding: 8px 20px;
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #084298;
        }



        a[href*="del"] {
            background-color: #dc3545;
        }
        a[href*="edit"]{
            background-color: aqua;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <center>
        <h1>District</h1>
    <form method="post">
        {% csrf_token %}
        <table border="2">
            <tr>
                <td>District</td>
                <td><input required type="text" name="txt_dist" value="{{editdata.district_name}}"
                        title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter"
                        pattern="^[A-Z]+[a-zA-Z ]*$"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="submit">
                </td>

            </tr>
        </table>
        <br>
        <table border="2">
            <tr>
                <td>Sno</td>
                <td>District Name</td>
                <td colspan="2" align="center">Action</td>

            </tr>
            {% for i in districtdata %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.district_name}}</td>
                <td><a href="{% url 'Admin:deldistrict' i.id %}">Delete</a></td>
                <td><a href="{% url 'Admin:editdistrict' i.id %}">Edit</a></td>
            </tr>
            {% endfor %}
        </table>
    </form>
    </center>
</body>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Admin:District' %}"
</script>
{% endif %}

</html>
{% endblock  %}
